name: CI

# One gated pipeline: nothing ships unless every stage before it passed.
#   check  → typecheck, unit tests, web build
#   e2e    → every game opened and played, plus layout and offline checks, on each screen type
#            (one job per Playwright project). Actions minutes are finite, so a push runs two
#            engines (desktop-chrome and iphone: one Chromium, one WebKit) and all eight run
#            weekly, on tags and on manual runs (docs/13-platforms-and-testing.md). Any console
#            error fails. Browser engines are cached; the Android emulator and iOS simulators
#            are opt-in because they are the expensive jobs.
#   deploy → GitHub Pages (main only)
# Release tags (v*) run the same gate; phone builds (TestFlight / Play internal) attach
# to tags once the Capacitor projects exist (docs/08-roadmap.md, M1).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: 'Also test the real iOS app on iPhone and iPad simulators (macOS minutes count 10x)'
        type: boolean
        default: false
      android:
        description: 'Also test the real Android app on an emulator (the most expensive job: about 25 minutes)'
        type: boolean
        default: false
      store:
        description: 'Also take the store screenshots at every store size, as an artifact'
        type: boolean
        default: false
  schedule:
    # Weekly run on every screen type (Mondays 06:00 UTC).
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/client/dist
      # The portal build (docs/08 M12d): the same game with no service worker, for CrazyGames,
      # Poki, GameDistribution and itch.io. Paths are already relative, so this is a folder that
      # can be zipped and uploaded the day there is an account to upload it to.
      - name: Build for the portals
        working-directory: apps/client
        run: VITE_PORTAL=1 pnpm build --outDir dist-portal
      - name: Check the portal build is really portal shaped
        working-directory: apps/client
        run: |
          set -e
          # A portal serves the game from its own origin, so ours must not install a worker there,
          # and some portals reject a build that does. Assert it rather than trust the flag.
          if grep -rq "serviceWorker" dist-portal/assets 2>/dev/null; then
            echo "The portal build still registers a service worker"; exit 1
          fi
          if [ -f dist-portal/sw.js ]; then echo "The portal build shipped a service worker"; exit 1; fi
          # Nothing may be fetched from an absolute path: the portal decides where this is served.
          if grep -oE 'src="/[^"]*"|href="/[^"]*"' dist-portal/index.html; then
            echo "The portal build has absolute paths"; exit 1
          fi
          echo "portal build ok: $(find dist-portal -type f | wc -l) files"
      - uses: actions/upload-artifact@v4
        with:
          name: portal-build
          path: apps/client/dist-portal

  e2e:
    needs: check
    runs-on: ubuntu-latest
    name: e2e (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["android-phone","iphone","ipad","ipad-landscape","android-tablet","desktop-chrome","desktop-safari","desktop-firefox"]' || '["desktop-chrome","iphone"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/client/dist
      - name: Which browser engine this screen type needs
        id: engine
        run: |
          case "${{ matrix.project }}" in
            iphone|ipad*|desktop-safari) engine=webkit ;;
            desktop-firefox) engine=firefox ;;
            *) engine=chromium ;;
          esac
          echo "name=$engine" >> "$GITHUB_OUTPUT"
      # Downloading a browser in every job was minutes we paid for on every run.
      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.engine.outputs.name }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: System libraries for ${{ steps.engine.outputs.name }}
        run: pnpm --filter @gamepals/client exec playwright install-deps ${{ steps.engine.outputs.name }}
      - name: Download ${{ steps.engine.outputs.name }} (only when it is not cached)
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @gamepals/client exec playwright install ${{ steps.engine.outputs.name }}
      # Whole-game playthroughs (@full) are slow: weekly, tags and manual runs only.
      - run: pnpm e2e --project ${{ matrix.project }} ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '--workers=2' || '--grep-invert @full' }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/client/playwright-report
      # Pictures of every game being played, for the quality passes (docs/08) and store shots later.
      - if: always() && hashFiles('apps/client/screenshots/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gallery-${{ matrix.project }}
          path: apps/client/screenshots

  # Store screenshots at the sizes Apple and Google ask for, from real play (docs/14-store-kit.md).
  # On demand only: nothing on a push needs them, and they are the owner's upload, not a gate.
  store:
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/client/dist
      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @gamepals/client exec playwright install-deps chromium
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @gamepals/client exec playwright install chromium
      - run: pnpm e2e --project store-iphone --project store-ipad --project store-play-phone --project store-play-tablet --project store-feature --grep @store
      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: apps/client/store

  # The real Android app (Capacitor APK) on an Android 14 emulator: every game played to the end
  # inside the app's own WebView. The most expensive job we run (about 25 minutes of Actions time),
  # so it is weekly, on release tags, or when a manual run ticks "android". The Android project is
  # generated here so nothing native lives in the repo or on the owner's Mac.
  android:
    needs: check
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.android)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/client/dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create the Android project and build the app
        working-directory: apps/client
        run: |
          pnpm cap:android
          cd android && ./gradlew assembleDebug --no-daemon
      - name: Free disk space for the emulator
        # The runner ships toolchains we never use; the emulator needs several GB for its data disk.
        # Keep the tool cache: Java and Node set up above live there, and the SDK tools need that Java.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/android/sdk/ndk
          df -h /
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        # A stuck emulator boot once burned the whole 90 minute job; fail fast instead.
        timeout-minutes: 45
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          # More memory for the WebView renderer, which draws WebGL in software on the emulator.
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r apps/client/android/app/build/outputs/apk/debug/app-debug.apk
            cd apps/client && node e2e-native/android.mjs; status=$?; mkdir -p native-shots; adb exec-out screencap -p > native-shots/android-final-screen.png || true; adb logcat -d -b crash > native-shots/android-crash-log.txt || true; echo "---- Android crash and process log"; adb logcat -d | grep -iE "AndroidRuntime|FATAL|render process|RenderProcessGone|chromium.*(crash|gone|oom)|lowmemorykiller|lmkd|am_crash|am_proc_died|am_anr|Force finishing" | tail -60 || true; exit $status
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: apps/client/native-shots
          if-no-files-found: ignore

  # The real iOS app on iPhone and iPad simulators. A self-test build (VITE_SELFTEST=1) plays every
  # game to the end inside the app and logs SELFTEST lines. macOS minutes count 10x on private repos,
  # so this runs on release tags, or on manual runs with "ios" ticked.
  ios:
    needs: check
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.ios)
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the self-test web app
        run: VITE_SELFTEST=1 pnpm build
      - name: Create the iOS project and build it for the simulator
        working-directory: apps/client
        run: |
          pnpm exec cap add ios
          pnpm exec cap sync ios
          if [ -d ios/App/App.xcworkspace ]; then target="-workspace ios/App/App.xcworkspace"; else target="-project ios/App/App.xcodeproj"; fi
          xcodebuild $target -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build | tail -25
      - name: Self-test on iPhone and iPad simulators
        run: bash apps/client/e2e-native/ios-selftest.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: apps/client/native-shots
          if-no-files-found: ignore

  deploy-web:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
