name: CI

# One gated pipeline: nothing ships unless every stage before it passed.
#   check  → typecheck, unit tests, web build
#   e2e    → every game opened and played, plus layout and offline checks, on each screen type
#            (one job per Playwright project; core set on every push, all eight weekly and on tags;
#            docs/13-platforms-and-testing.md); any console error fails
#   deploy → GitHub Pages (main only)
# Release tags (v*) run the same gate; phone builds (TestFlight / Play internal) attach
# to tags once the Capacitor projects exist (docs/08-roadmap.md, M1).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run on every screen type (Mondays 06:00 UTC).
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/client/dist

  e2e:
    needs: check
    runs-on: ubuntu-latest
    name: e2e (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["android-phone","iphone","ipad","ipad-landscape","android-tablet","desktop-chrome","desktop-safari","desktop-firefox"]' || '["android-phone","iphone","ipad-landscape","desktop-chrome"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/client/dist
      - name: Install the browser engine for ${{ matrix.project }}
        run: |
          case "${{ matrix.project }}" in
            iphone|ipad*|desktop-safari) engine=webkit ;;
            desktop-firefox) engine=firefox ;;
            *) engine=chromium ;;
          esac
          pnpm --filter @gamepals/client exec playwright install --with-deps "$engine"
      # Whole-game playthroughs (@full) are slow: weekly, tags and manual runs only.
      - run: pnpm e2e --project ${{ matrix.project }} ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '--workers=2' || '--grep-invert @full' }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/client/playwright-report

  # The real Android app (Capacitor APK) on an Android 14 emulator: every game played to the end
  # inside the app's own WebView. Full runs only (weekly, tags, manual); the Android project is
  # generated here so nothing native lives in the repo or on the owner's Mac.
  android:
    needs: check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/client/dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create the Android project and build the app
        working-directory: apps/client
        run: |
          pnpm cap:android
          cd android && ./gradlew assembleDebug --no-daemon
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r apps/client/android/app/build/outputs/apk/debug/app-debug.apk
            cd apps/client && node e2e-native/android.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: apps/client/native-shots
          if-no-files-found: ignore

  deploy-web:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
